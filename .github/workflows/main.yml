name: Otomatik IPTV Link Kontrolu

on:
  schedule:
    # Her 6 saatte bir otomatik çalışır (Günde 4 kez listeyi tazeler)
    - cron: '0 */6 * * *'
  workflow_dispatch: # İstediğin zaman "Run" butonuna basıp elle çalıştırmak için

jobs:
  check-iptv:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Bilgisayara Çek
      uses: actions/checkout@v4

    - name: Python Kurulumu yap
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Gerekli Kütüphaneleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: IPTV Bulucu Kodunu Çalıştır
      run: python main.py

    - name: Değişiklikleri Depoya Geri Yükle (Push)
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        git add otomatik_liste.m3u
        git commit -m "Liste Guncellendi" || echo "Değişiklik yok"
        git push
