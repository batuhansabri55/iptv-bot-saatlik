name: Otomatik IPTV Link Kontrolu

on:
  schedule:
    - cron: '0 * * * *' # Her saat başı çalışır
  workflow_dispatch: # 👈 İŞTE BU SATIR GRİ BUTONU ZORLA EKLETİR USTA!

jobs:
  check-iptv:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Bilgisayara Cek
      uses: actions/checkout@v3

    - name: Python Kurulumu yap
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Gerekli Kutuphaneleri Yukle
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: IPTV Bulucu Kodunu Calistir
      run: python main.py

    - name: Listeyi Diger Depoya Otomatik Gonder
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # 1. AkcagozTV_Canli deponuzu buraya geçici olarak çekiyoruz
        git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/batuhansabri55/AkcagozTV_Canli.git dondurulen_depo
        
        # 2. Üretilen tr.m3u dosyasını o klasörün içine kopyalıyoruz
        cp tr.m3u dondurulen_depo/tr.m3u
        
        # 3. Klasörün içine girip değişiklikleri push ediyoruz
        cd dondurulen_depo
        git add tr.m3u
        git commit -m "Canlı Türkçe Listesi Otomatik Güncellendi" || exit 0
        git push
