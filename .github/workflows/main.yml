name: Otomatik IPTV Link Kontrolu

on:
  schedule:
    - cron: '0 * * * *' # Her saat başı çalışır
  workflow_dispatch: # Elle başlatma butonu

jobs:
  check-iptv:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Bilgisayara Cek
      uses: actions/checkout@v3

    - name: Python Kurulumu yap
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Gerekli Kutuphaneleri Yukle
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: IPTV Bulucu Kodunu Calistir
      run: python main.py

    - name: Canli Linki Diger Deponun Yedek Listesine Ekle
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # 1. Adım: İkinci deponuzu (AkcagozTV_Canli) çekiyoruz
        git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/batuhansabri55/AkcagozTV_Canli.git dondurulen_depo
        
        # 2. Adım: Eğer bot taze bir canlı link bulabildiyse işleme başla
        if [ -f canli_panel.txt ]; then
          CANLI_URL=$(cat canli_panel.txt)
          echo "🔗 Enjekte edilecek canlı URL: $CANLI_URL"
          
          # İkinci deponun içindeki update_list.py dosyasına taze linki YEDEK_KAYNAKLAR listesinin sonuna ekliyoruz
          sed -i "/YEDEK_KAYNAKLAR = \[/a \    \"$CANLI_URL\"," dondurulen_depo/update_list.py
          
          # 3. Adım: Değişiklikleri push ederek ikinci depoyu güncelliyoruz
          cd dondurulen_depo
          git add update_list.py
          git commit -m "Bot Tarafından Canlı Yedek Kaynak Eklendi" || exit 0
          git push
        else
          echo "❌ Bu turda canlı panel bulunamadığı için dosya güncellenmedi."
        fi
